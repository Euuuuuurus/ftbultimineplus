# FTB Ultimine Plus - backport of FTB Ultimine 2101.1.x features to Minecraft 1.18.2 Forge
# Version matrix: MC 1.18.2 / Forge 40.2.21 / Java 17 / Gradle 7.4.2 / ForgeGradle 5.1.x

minecraft_version=1.18.2
minecraft_version_range=[1.18.2,1.19)
forge_version=40.2.21
forge_version_range=[40.2.4,)

# Dependencies (pinned to the versions used by FTB Ultimine 1802.3.4)
ftb_ultimine_version=1802.3.4-build.93
ftb_library_version=1802.3.6-build.115
architectury_version=4.1.36

# Mod metadata
mod_id=ftbultimineplus
mod_name=FTB Ultimine Plus
mod_license=MIT
mod_version=1.0.1-1.18.2
mod_group_id=ftbultimineplus
mod_authors=DSH
mod_description=Backport of newer FTB Ultimine features (right-click axe strip / shovel flatten, large tunnel shape, configurable preview alpha) to Minecraft 1.18.2 Forge

# Build settings
org.gradle.jvmargs=-Xmx3G -Djava.io.tmpdir=D:/agent/FTBUltimine/tmp -Dnet.minecraftforge.gradle.check.certs=false
org.gradle.daemon=false

# Workspace-local Gradle cache (DSH sandbox cannot write outside the workspace)
org.gradle.user.home=D:/agent/FTBUltimine/.gradle-home