[[mods]]
modId="ftbultimineplus"
version="${file.jarVersion}"
displayName="FTB Ultimine Plus"
authors="DSH"
description='''Backport of newer FTB Ultimine features to Minecraft 1.18.2 Forge:
- Right-click with the Ultimine key held + axe to strip logs / scrape copper in bulk
- Right-click with the Ultimine key held + shovel to flatten grass/dirt in bulk
- Large (3x3) tunnel shape
- Configurable preview outline alpha
Works on top of FTB Ultimine 1802.3.x without modifying its jar.'''

